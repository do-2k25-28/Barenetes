apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: default
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
          hostPort: 8080
          protocol: TCP
      env:
        - name: ENV
          value: production
  resources:
    requests:
      cpu: 250
      memory: 256
    limits:
      cpu: 500
      memory: 512
