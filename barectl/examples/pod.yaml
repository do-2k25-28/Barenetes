apiVersion: v1
kind: Pod
metadata:
  name: web-stack
  namespace: test2
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
          hostPort: 8080
          protocol: tcp
      env:
        - name: ENV
          value: production
    - name: sidecar
      image: fluentbit:latest
  resources:
    requests:
      cpu: 250
      memory: 256
    limits:
      cpu: 500
      memory: 512
