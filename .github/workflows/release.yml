name: Release

# Builds all workspace binaries in release mode and publishes them as assets
# on a GitHub Release, so deploy/install.sh can fetch them with a plain curl.
# The barectl CLI is additionally published as a .deb, a .rpm, and a pacman
# .pkg.tar.zst, so it can be installed directly on Debian/Ubuntu,
# Fedora/RHEL-family, and Arch-family distros.
#
# Triggered by pushing a version tag (v1.2.3), or manually for a re-run.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)publish binaries for"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build and publish release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set crate version from release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$RELEASE_TAG' is not a valid vX.Y.Z version tag" >&2
            exit 1
          fi
          echo "Setting workspace version to $VERSION (from tag $RELEASE_TAG)"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cargo generate-lockfile

      - name: Build workspace binaries (release)
        run: cargo build --workspace --release --locked

      - name: Package binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for bin in agent api barectl cni scheduler; do
            install -m 0755 "target/release/$bin" "dist/barenetes-$bin-linux-x86_64"
          done

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Package barectl as .deb
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          PKG="barenetes-barectl"
          ARCH="amd64"

          ROOT="pkg/${PKG}_${VERSION}_${ARCH}"
          mkdir -p "${ROOT}/usr/bin" "${ROOT}/DEBIAN"
          install -m 0755 target/release/barectl "${ROOT}/usr/bin/barectl"

          cat > "${ROOT}/DEBIAN/control" <<EOF
          Package: ${PKG}
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: do-2k25-28 <do-2k25-28@users.noreply.github.com>
          Description: Barenetes CLI (kubectl-style client for the Barenetes API server)
          EOF
          cat > "${ROOT}/DEBIAN/md5sums" <<EOF
          $(md5sum "${ROOT}/usr/bin/barectl" | awk '{print $1"  usr/bin/barectl"}')
          EOF

          dpkg-deb --build --root-owner-group "${ROOT}" "dist/${PKG}_${VERSION}_${ARCH}.deb"

      - name: Package barectl as .rpm
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          PKG="barenetes-barectl"
          ARCH="x86_64"

          export RPMBUILD_TOPDIR="$(mktemp -d)"
          mkdir -p "${RPMBUILD_TOPDIR}"/{BUILD,BUILDROOT,RPMS,SOURCES,SRPMS,specs}
          # %install runs in rpmbuild's own build dir, so the binary must be
          # referenced by absolute path.
          BIN="$(pwd)/target/release/barectl"
          cat > "${RPMBUILD_TOPDIR}/specs/${PKG}.spec" <<EOF
          Name: ${PKG}
          Version: ${VERSION}
          Release: 1%{?dist}
          Summary: Barenetes CLI (kubectl-style client for the Barenetes API server)
          License: MIT
          URL: https://github.com/do-2k25-28/Barenetes
          BuildArch: ${ARCH}
          %description
          Barenetes CLI (kubectl-style client for the Barenetes API server)

          %install
          mkdir -p %{buildroot}/usr/bin
          install -m 0755 ${BIN} %{buildroot}/usr/bin/barectl

          %files
          /usr/bin/barectl
          EOF

          rpmbuild --bb --define "_topdir ${RPMBUILD_TOPDIR}" "${RPMBUILD_TOPDIR}/specs/${PKG}.spec"
          install -m 0644 "${RPMBUILD_TOPDIR}/RPMS/${ARCH}/${PKG}-${VERSION}-1.${ARCH}.rpm" "dist/${PKG}-${VERSION}-1.${ARCH}.rpm"

      - name: Package barectl as pacman .pkg.tar.zst
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          PKG="barenetes-barectl"
          ARCH="x86_64"

          ROOT="pkg/${PKG}-${VERSION}-1-${ARCH}"
          mkdir -p "${ROOT}/usr/bin"
          install -m 0755 target/release/barectl "${ROOT}/usr/bin/barectl"

          # .PKGINFO's size field is the final compressed package size, which
          # isn't known until after a build -- so build with a placeholder,
          # measure, and rebuild until the recorded size matches the actual
          # one (the digit count of the size affects the compressed size).
          write_pkginfo() {
            cat > "${ROOT}/.PKGINFO" <<EOF
          pkgname = ${PKG}
          pkgver = ${VERSION}
          pkgdesc = Barenetes CLI (kubectl-style client for the Barenetes API server)
          arch = ${ARCH}
          url = https://github.com/do-2k25-28/Barenetes
          builddate = $(date +%s)
          size = $1
          packager = do-2k25-28 <do-2k25-28@users.noreply.github.com>
          EOF
          }
          cat > "${ROOT}/.BUILDINFO" <<EOF
          format = 2
          pkgname = ${PKG}
          pkgbase = ${PKG}
          pkgver = ${VERSION}
          pkgarch = ${ARCH}
          pkgbuildtime = $(date +%s)
          buildhost = $(hostname)
          EOF

          PKGFILE="dist/${PKG}-${VERSION}-1-${ARCH}.pkg.tar.zst"
          build_pkg() {
            rm -f "${PKGFILE}"
            tar --sort=name --owner=0 --group=0 --numeric-owner -C "${ROOT}" -cf - . \
              | zstd -q -T0 -o "${PKGFILE}"
          }
          recorded_size() {
            grep -m1 '^size = ' "${ROOT}/.PKGINFO" | awk '{print $3}'
          }

          write_pkginfo 0
          build_pkg
          for _ in 1 2 3 4 5; do
            SIZE="$(stat -c%s "${PKGFILE}")"
            [[ "$SIZE" -eq "$(recorded_size)" ]] && break
            write_pkginfo "${SIZE}"
            build_pkg
          done
          [[ "$(stat -c%s "${PKGFILE}")" -eq "$(recorded_size)" ]] \
            || { echo "::error::pkg size field did not converge" >&2; exit 1; }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          append_body: false
          fail_on_unmatched_files: true
