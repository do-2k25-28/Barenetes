syntax = "proto3";

package cni.v1;

// Local RPC interface exposed by the CNI daemon to the node agent.
service CniService {
  rpc AddWorkloadNetwork(AddWorkloadNetworkRequest) returns (AddWorkloadNetworkResponse);
  rpc DeleteWorkloadNetwork(DeleteWorkloadNetworkRequest) returns (DeleteWorkloadNetworkResponse);
  rpc GetWorkloadNetwork(GetWorkloadNetworkRequest) returns (GetWorkloadNetworkResponse);
}

// Identifies the workload instance that the agent is referring to.
message WorkloadRef {
  // Readable name for the workload.
  string workload_name = 1;

  // Readable name for the workload instance.
  string instance_name = 2;
}

// Identifies the tenant network used by a workload instance.
message NetworkRef {
  // Readable name for the network.
  string network_name = 1;

  // Explicit bridge VLAN used to isolate this tenant (1-4094).
  uint32 vlan_id = 2;
}

//===================// WorkloadNetwork struct and states //===================//

// Main network information for a workload instance.
message WorkloadNetwork {
  // Simple state indicating whether the workload is ready on the network.
  NetworkState state = 1;

  // Name of the interface in the workload, often "eth0".
  string interface_name = 2;

  // IP address of the workload, for example "10.244.1.0".
  string ip_address = 3;

  // Gateway address, for example "10.244.1.1".
  string gateway = 4;

  // Name of the dedicated tenant network.
  string network_name = 5;
}

enum NetworkState {
  UNSPECIFIED = 0;
  READY = 1;
  ERROR = 2;
}

//===================// add WorkloadNetwork //===================//

message AddWorkloadNetworkRequest {
  // Workload instance to connect to the network.
  WorkloadRef workload = 1;

  // Dedicated tenant network to use.
  NetworkRef network = 2;

  // Network namespace of the workload, restricted to /proc/<pid>/ns/net.
  string netns_path = 3;

  // Interface name inside the workload network namespace.
  string interface_name = 4;
}

message AddWorkloadNetworkResponse {
  // Network result given to the workload instance.
  WorkloadNetwork network = 1;
}

//===================// delete WorkloadNetwork //===================//

message DeleteWorkloadNetworkRequest {
  // Workload instance to disconnect from the network.
  WorkloadRef workload = 1;

  // Dedicated tenant network used by the workload instance.
  NetworkRef network = 2;
}

message DeleteWorkloadNetworkResponse {
  // True if the cleanup was successful.
  bool success = 1;
}

//===================// get WorkloadNetwork //===================//

message GetWorkloadNetworkRequest {
  // Workload instance for which to retrieve network state.
  WorkloadRef workload = 1;

  // Dedicated tenant network used by the workload instance.
  NetworkRef network = 2;
}

message GetWorkloadNetworkResponse {
  // Network state for the requested workload instance.
  WorkloadNetwork network = 1;
}
