syntax = "proto3";

package shared.v1;

enum Protocol {
    TCP = 0;
    UDP = 1;
}

message Port {
    uint32 internal = 1;
    uint32 external = 2;
    Protocol protocol = 3;
}

message EnvVar {
    string name = 1;
    string value = 2;
}

message Container {
    string name = 1;
    string image = 2; // OCI image reference
    repeated Port ports = 3;
    repeated EnvVar env = 4;
}

// Observed state of a single container running on a node
enum State {
    STATE_UNSPECIFIED = 0; 
    STATE_RUNNING     = 1;
    STATE_CRASHED     = 2;
    STATE_PENDING     = 3;
}

enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    EVENT_TYPE_ADDED       = 1;
    EVENT_TYPE_MODIFIED    = 2;
    EVENT_TYPE_DELETED     = 3;
    EVENT_TYPE_SCHEDULED   = 4;
}
