syntax = "proto3";

package shared.v1;

import "shared/v1/resources.proto";

enum NodeStatus {
  READY = 0;
  CORDON = 1; // Cannot schedule pods
  DRAIN = 2; // Move all pods to other nodes
  NOT_READY = 3;
}

message Node {
  string name = 1; // hostname, for humans; not the identity
  NodeStatus status = 2;
  Resources capacity = 3; // Total machine resources
  Resources allocatable = 4; // Resources currently free on the machine, as observed by the agent
  // Stable identity, generated by the agent and persisted on the node so it
  // survives restarts. A fresh id on every start would register a new node
  // each time and orphan the old one.
  string id = 5;
}
